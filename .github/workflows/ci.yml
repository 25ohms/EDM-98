name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Package And Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Dataset Validation Tests
        run: pytest -q

      - name: Run CLI Validation Smoke Test
        run: PYTHONPATH=src python -m edm98.cli validate-dataset data/dataset.jsonl --splits-dir data/splits

  inference-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inference Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,inference]"

      - name: Run Tests Including Optional Inference Smoke
        run: pytest -q
