[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edm98"
version = "0.1.0"
description = "EDM-98 dataset package with optional EDMFormer inference tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
  { name = "Sahal Sajeer Kalandan" }
]
keywords = ["music", "dataset", "edm", "structure-analysis", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/25ohms/EDM-98"
Repository = "https://github.com/25ohms/EDM-98"
Issues = "https://github.com/25ohms/EDM-98/issues"
Paper = "https://arxiv.org/abs/2603.08759"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.11.0",
  "PyYAML>=6.0"
]
inference = [
  "PyYAML>=6.0",
  "torch>=2.4.0",
  "librosa>=0.11.0",
  "omegaconf>=2.3.0",
  "safetensors>=0.5.3",
  "x-transformers>=2.4.14",
  "scipy>=1.15.0"
]
ui = [
  "gradio>=5.0"
]

[project.scripts]
edm98 = "edm98.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "data/LICENSE"]

[tool.setuptools.package-data]
edm98 = [
  "resources/dataset.jsonl",
  "resources/splits/*.txt"
]

[tool.setuptools.packages.find]
where = ["src"]
