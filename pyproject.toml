[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edm98"
version = "0.1.0"
description = "EDM-98 dataset and EDMFormer inference tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [
  { name = "EDM-98 contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.11.0",
  "PyYAML>=6.0"
]
inference = [
  "PyYAML>=6.0",
  "torch>=2.4.0",
  "librosa>=0.11.0",
  "omegaconf>=2.3.0",
  "safetensors>=0.5.3",
  "x-transformers>=2.4.14",
  "scipy>=1.15.0",
  "muq @ git+https://github.com/tencent-ailab/MuQ.git",
  "musicfm @ git+https://github.com/minzwon/musicfm.git"
]
ui = [
  "gradio>=5.0"
]

[project.scripts]
edm98 = "edm98.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
